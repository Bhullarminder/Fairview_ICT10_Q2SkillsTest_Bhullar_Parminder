<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills test</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand text-white">Non Metal element finder</span>
    </div>
</nav>

<div class="container bg-dark p-4 mt-5 w-50 rounded shadow">

    <h3 class="text-center, text-white">NON METALS</h3>

    <p class="text-center, text-white">
        Enter an element symbol to find out whether it is a nonmetal or not
    </p>

    <div class="mb-3, text-white">
        <label for="Element" class="form-label">Element</label>
        <input type="text" id="Element" class="form-control" placeholder="Enter Element Symbol">
    </div>


    <button py-click="elements" class="btn btn-primary w-100">
        Check
    </button>

    <div id="result" class="mt-4, text-white"></div>

</div>

<script type="py" src="main.py"></script>

</body>
</html>
